<body>

    <!-- Menú de navegación -->
    <nav>

    <!-- Contenedor donde se mostrará la fecha y hora con tu función -->
    <div id="reloj" style="background-color: #f2f2f2; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; font-weight: bold;">
        Cargando fecha y hora...
    </div>

    <h1>Bienvenido a mi Primera Página Web</h1>

    <p>HOLAAAAAA my people este es mi primera pagina que te dijera y agregue unas imagenes, pero les cometo que dificil fue poner la imagen de la web.</p>

    <div>
        <!-- Esta imagen se pone desde local --> 
        <img src="../Fotos/mifoto.jpg" alt="Imagen 1">

        <!-- Esta imagen es desde la web -->
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1SmLykQZ8gdj9Bqk0NIL_wKvuwOX_kgFQscHJKFBWhRdm6b2vI9Y_OVZs&s=10" alt="Imagen 2">
    </div>

    <!-- Script con tu función exacta -->
    <script>
        function mostrarFechaHora() {
            let reloj = document.getElementById('reloj');
            if (reloj) {
                let fecha = new Date();
                reloj.innerHTML = "Hoy es: " + fecha.toLocaleString('es-MX', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric', 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit' 
                });
            }
        }

        // Ejecutar la función inmediatamente al cargar
        mostrarFechaHora();
        
        // Actualizar cada segundo (1000 milisegundos) para que los segundos corran en vivo
        setInterval(mostrarFechaHora, 1000);
    </script>
</body>
</html>
